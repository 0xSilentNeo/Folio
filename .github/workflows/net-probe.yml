name: Net probe (temporary)

# Times the addon hosts from a GitHub runner (outside the app): DNS, connect,
# TLS, first byte, total, five rounds. Runs when this file is pushed.

on:
  push:
    branches-ignore: [main]
    paths: ['.github/workflows/net-probe.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe
        run: |
          for round in 1 2 3 4 5; do
            for u in https://aiostreams-nightly.fortheweak.cloud/ \
                     https://aiostreams-nightly.fortheweak.cloud/stremio/manifest.json \
                     https://meteorfortheweebs.midnightignite.me/ \
                     https://meteorfortheweebs.midnightignite.me/manifest.json; do
              curl -sS -m 30 -o /dev/null -w "round $round %{http_code} dns=%{time_namelookup} connect=%{time_connect} tls=%{time_appconnect} firstbyte=%{time_starttransfer} total=%{time_total} $u\n" "$u" 2>&1 | tail -1 | tee -a probe.txt
            done
            sleep 10
          done
          sed 's/^/::notice::/' probe.txt
