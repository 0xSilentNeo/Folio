name: UI lab (simulator recording)

on:
  workflow_dispatch:
    inputs:
      modes:
        description: 'JSON list of lab modes (metal, gl, noengine, poplab, uitest)'
        default: '["poplab"]'

permissions:
  contents: write

jobs:
  record:
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(github.event.inputs.modes || '["poplab"]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$XC" ] && XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios || true

      - name: Fetch engine (stock MPVKit — simulator slices)
        run: ENGINE=stock SLICE=simulator bash scripts/fetch-engine.sh

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate --spec project.yml

      - name: Build for simulator
        run: |
          ACTION=build; [ "${{ matrix.variant }}" = "uitest" ] && ACTION=build-for-testing
          xcodebuild -project GlassPlayer.xcodeproj -scheme GlassPlayer -sdk iphonesimulator -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="-" $ACTION > build.log 2>&1 || {
              grep -E "error:|ld: |Undefined symbol" build.log | sort -u | head -40 | sed 's/^/::error::/'
              tail -60 build.log | sed 's/^/::warning::/'
              exit 1
            }
          ls build/Build/Products/Release-iphonesimulator

      - name: Boot simulator
        id: sim
        run: |
          RT=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; r=[x for x in json.load(sys.stdin)["runtimes"] if x["platform"]=="iOS" and x["isAvailable"]]; r.sort(key=lambda x:[int(p) for p in x["version"].split(".")]); print(r[-1]["identifier"])')
          DT=$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys; d=[x for x in json.load(sys.stdin)["devicetypes"] if x["name"].startswith("iPhone 1") and "Pro" in x["name"] and "Max" not in x["name"]]; print(d[-1]["identifier"])')
          echo "runtime=$RT devicetype=$DT"
          UDID=$(xcrun simctl create lab "$DT" "$RT")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          open -a Simulator --args -CurrentDeviceUDID "$UDID"
          sleep 15
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Install, record, drive
        run: |
          UDID=${{ steps.sim.outputs.udid }}
          APP=build/Build/Products/Release-iphonesimulator/GlassPlayer.app
          xcrun simctl install "$UDID" "$APP"
          mkdir -p lab
          xcrun simctl io "$UDID" recordVideo --codec h264 --force lab/lab.mp4 &
          REC=$!
          sleep 10
          EXTRA=""; [ "${{ matrix.variant }}" = "gl" ] && EXTRA="-labGL"; [ "${{ matrix.variant }}" = "noengine" ] && EXTRA="-labNoEngine"; [ "${{ matrix.variant }}" = "poplab" ] && EXTRA="-popLab"
          ARGS="-uiLab $EXTRA"; [ "${{ matrix.variant }}" = "poplab" ] && ARGS="-popLab"
          if [ "${{ matrix.variant }}" = "uitest" ]; then
            xcodebuild test-without-building -project GlassPlayer.xcodeproj -scheme GlassPlayer -configuration Release \
              -destination "id=$UDID" -derivedDataPath build -only-testing:GlassPlayerUITests > lab/test.log 2>&1 || echo "::warning::UI test failed (see lab/test.log)"
            grep -E "error:|failed|passed|Test Case|RAPID" lab/test.log | tail -40 | sed 's/^/::notice::/'
            sleep 3
          else
            xcrun simctl launch --terminate-running-process "$UDID" dev.silentneo.glassplayer $ARGS
            sleep 42
          fi
          xcrun simctl spawn "$UDID" log show --last 3m --predicate 'process == "GlassPlayer" AND (messageType == error OR messageType == fault OR eventMessage CONTAINS "[lab]" OR eventMessage CONTAINS "[ui]" OR eventMessage CONTAINS "[player")' --style compact > lab/console.log 2>/dev/null || true
          CONT=$(xcrun simctl get_app_container "$UDID" dev.silentneo.glassplayer data || true)
          [ -n "$CONT" ] && find "$CONT" -path "*diagnostics*" -name "*.log" -exec cp {} lab/ \; || true
          mkdir -p lab/crashes && cp ~/Library/Logs/DiagnosticReports/*GlassPlayer* lab/crashes/ 2>/dev/null || true
          kill -INT $REC; wait $REC || true
          ls -la lab

      - name: Publish results to the lab-results branch
        if: always()
        run: |
          git config user.name lab-bot
          git config user.email lab@users.noreply.github.com
          mkdir -p out && cp -R lab/* out/ 2>/dev/null || true
          cp build.log out/ 2>/dev/null || true
          cd out && git init -q && git checkout -q -b "lab-${{ matrix.variant }}" && git add -A && git commit -qm "lab run ${{ github.run_id }}" \
            && git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "lab-${{ matrix.variant }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-lab-${{ matrix.variant }}
          path: lab/
