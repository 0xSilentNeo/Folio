name: UI lab (simulator recording)

on:
  workflow_dispatch:
    inputs:
      modes:
        description: 'JSON list of lab modes (metal, gl, noengine, poplab, uitest)'
        default: '["poplab"]'
      only:
        description: 'xcodebuild -only-testing filter for uitest modes'
        default: 'GlassPlayerUITests'
      runner:
        description: 'Runner: xcode-27 (iOS 27 SDK + simulator) or macos-15 (Xcode 26, iOS 26)'
        default: 'xcode-27'
      extra:
        description: 'Extra launch arguments for the app (lab modes)'
        default: ''

permissions:
  contents: write

jobs:
  record:
    runs-on: ${{ github.event.inputs.runner || 'xcode-27' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(github.event.inputs.modes || '["poplab"]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Newest released Xcode 27 (by version, not folder name; no betas or RCs), else 26.
          pick() { for x in "$@"; do [ -d "$x" ] || continue; case "$x" in *beta*|*Beta*|*Release_Candidate*) continue;; esac
            echo "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$x/Contents/version.plist") $x"; done | sort -V | tail -1 | cut -d' ' -f2-; }
          XC=$(pick /Applications/Xcode_27*.app)
          [ -z "$XC" ] && XC=$(pick /Applications/Xcode_26*.app)
          [ -z "$XC" ] && XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios || true

      - name: Fetch engine (stock MPVKit — simulator slices)
        run: ENGINE=stock SLICE=simulator bash scripts/fetch-engine.sh

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate --spec project.yml

      - name: Build for simulator
        run: |
          ACTION=build; case "${{ matrix.variant }}" in uitest*) ACTION=build-for-testing;; esac
          xcodebuild -project GlassPlayer.xcodeproj -scheme GlassPlayer -sdk iphonesimulator -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="-" $ACTION > build.log 2>&1 || {
              grep -E "error:|ld: |Undefined symbol" build.log | sort -u | head -40 | sed 's/^/::error::/'
              tail -60 build.log | sed 's/^/::warning::/'
              exit 1
            }
          ls build/Build/Products/Release-iphonesimulator

      - name: Boot simulator
        id: sim
        run: |
          note() { echo "::notice title=sim::$*"; }
          note "python3: $(command -v python3 || echo none) jq: $(command -v jq || echo none)"
          xcrun simctl list runtimes -j > runtimes.json
          xcrun simctl list devicetypes -j > devicetypes.json
          xcrun simctl list devices available -j > devices.json
          # Prefer a simulator the image already has: an iPhone Pro on the newest iOS runtime.
          PICK=$(jq -r '.devices | to_entries[] | select(.key|test("SimRuntime.iOS-")) | .key as $rt | .value[]
                 | select(.isAvailable and (.name|test("^iPhone [0-9]+ Pro$")))
                 | "\($rt | capture("iOS-(?<v>[0-9-]+)").v | gsub("-";".")) \(.name | capture("(?<n>[0-9]+)").n) \(.udid) \($rt)"' devices.json \
                 | sort -t' ' -k1,1V -k2,2n | tail -1)
          note "existing devices: $(jq -r '[.devices | to_entries[] | select(.key|test("iOS-2[67]")) | "\(.key|capture("iOS-(?<v>[0-9-]+)").v): \(.value | map(.name) | join(", "))"] | join(" | ")' devices.json)"
          if [ -n "$PICK" ]; then
            UDID=$(echo "$PICK" | cut -d' ' -f3)
            note "using existing $PICK"
          else
            RT=$(jq -r '[.runtimes[] | select(.platform=="iOS" and .isAvailable)] | sort_by(.version | split(".") | map(tonumber)) | last | .identifier' runtimes.json)
            jq -r '.devicetypes[] | select(.name|test("^iPhone [0-9]+ Pro$")) | "\(.name | capture("(?<n>[0-9]+)").n) \(.identifier)"' devicetypes.json | sort -rn > candidates.txt
            UDID=""
            while read -r _ DT; do
              if UDID=$(xcrun simctl create lab "$DT" "$RT" 2>create.err); then note "created $DT"; break; fi
              note "create $DT on $RT: $(head -c 300 create.err | tr '\n' ' ')"
              UDID=""
            done < candidates.txt
            [ -n "$UDID" ] || { note "no simulator for $RT"; exit 1; }
          fi
          note "created $UDID"
          xcrun simctl boot "$UDID" || { note "boot failed ($?)"; exit 1; }
          xcrun simctl bootstatus "$UDID" -b || note "bootstatus returned $?"
          open -a Simulator --args -CurrentDeviceUDID "$UDID" || note "open Simulator returned $?"
          sleep 15
          note "booted $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Install, record, drive
        run: |
          UDID=${{ steps.sim.outputs.udid }}
          APP=build/Build/Products/Release-iphonesimulator/GlassPlayer.app
          xcrun simctl install "$UDID" "$APP"
          mkdir -p lab
          xcrun simctl io "$UDID" recordVideo --codec h264 --force lab/lab.mp4 &
          REC=$!
          sleep 10
          V="${{ matrix.variant }}"; EXTRA=""; case "$V" in av-*) AO="${V#av-}"; EXTRA="-avLab -labAO=${AO%%.*}";; esac; [ "${{ matrix.variant }}" = "gl" ] && EXTRA="-labGL"; [ "${{ matrix.variant }}" = "noengine" ] && EXTRA="-labNoEngine"; [ "${{ matrix.variant }}" = "poplab" ] && EXTRA="-popLab"
          ARGS="-uiLab $EXTRA"; [ "${{ matrix.variant }}" = "poplab" ] && ARGS="-popLab"; case "${{ matrix.variant }}" in av-*) ARGS="$EXTRA";; imdb) ARGS="-noSplash -imdbProbe=tt0944947";; glasslab) ARGS="-noSplash -glassLab";; skip) ARGS="-noSplash -skipProbe";; parse) ARGS="-noSplash -parseProbe";; names) ARGS="-noSplash -nameProbe";; esac
          ARGS="$ARGS ${{ github.event.inputs.extra }}"
          if case "${{ matrix.variant }}" in uitest*) true;; *) false;; esac; then
            ONLY="${{ github.event.inputs.only || 'GlassPlayerUITests' }}"; OT=""
            for t in ${ONLY//,/ }; do OT="$OT -only-testing:$t"; done
            xcodebuild test-without-building -project GlassPlayer.xcodeproj -scheme GlassPlayer -configuration Release \
              -destination "id=$UDID" -derivedDataPath build $OT > lab/test.log 2>&1 || echo "::warning::UI test failed (see lab/test.log)"
            grep -E "error:|failed|passed|Test Case|RAPID|HALFSEC|PULL|SWITCH|LEAVING|MOVING" lab/test.log | tail -40 | sed 's/^/::notice::/'
            sleep 3
          else
            xcrun simctl launch --terminate-running-process "$UDID" dev.silentneo.glassplayer $ARGS
            sleep 42
            [ "${{ matrix.variant }}" = "names" ] && sleep 150   # IMDb lookups through the web view are slow in CI
          fi
          xcrun simctl spawn "$UDID" log show --last 6m --predicate 'process == "GlassPlayer" AND (messageType == error OR messageType == fault OR eventMessage CONTAINS "[lab]" OR eventMessage CONTAINS "[av]" OR eventMessage CONTAINS "[ui]" OR eventMessage CONTAINS "[player" OR eventMessage CONTAINS[c] "present" OR eventMessage CONTAINS[c] "popover")' --style compact > lab/console.log 2>/dev/null || true
          CONT=$(xcrun simctl get_app_container "$UDID" dev.silentneo.glassplayer data || true)
          [ -n "$CONT" ] && find "$CONT" -path "*diagnostics*" -name "*.log" -exec cp {} lab/ \; || true
          mkdir -p lab/crashes && cp ~/Library/Logs/DiagnosticReports/*GlassPlayer* lab/crashes/ 2>/dev/null || true
          kill -INT $REC; wait $REC || true
          ls -la lab

      - name: Publish results to the lab-results branch
        if: always()
        run: |
          git config user.name lab-bot
          git config user.email lab@users.noreply.github.com
          mkdir -p out && cp -R lab/* out/ 2>/dev/null || true
          tail -3000 build.log > out/build-tail.log 2>/dev/null || true
          # GitHub refuses files over 100 MB: split big ones (cat them back together).
          find out -type f -size +90M | while read f; do split -b 90m "$f" "$f.part-" && rm "$f"; done
          cd out && git init -q && git checkout -q -b "lab-${{ matrix.variant }}" && git add -A && git commit -qm "lab run ${{ github.run_id }}" \
            && git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "lab-${{ matrix.variant }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-lab-${{ matrix.variant }}
          path: lab/
