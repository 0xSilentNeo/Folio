name: Probe runners (temporary)
on:
  push:
    branches: [probe-runners]
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - run: |
          sw_vers
          ls -d /Applications/Xcode*.app
          for x in /Applications/Xcode_27*.app /Applications/Xcode_26*.app; do [ -d "$x" ] && echo "$x: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' $x/Contents/version.plist)"; done
          xcrun simctl list runtimes | grep -i ios || true
          for x in /Applications/Xcode_27*.app; do [ -d "$x" ] && DEVELOPER_DIR=$x/Contents/Developer xcrun simctl list runtimes | grep -i ios; done || true
