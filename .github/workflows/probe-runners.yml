name: Probe runners (temporary)
on:
  push:
    branches: [probe-runners]
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [xcode-27]
    runs-on: ${{ matrix.os }}
    steps:
      - run: |
          {
            echo "macOS $(sw_vers -productVersion)"
            for x in /Applications/Xcode*.app; do echo "$x $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' $x/Contents/version.plist 2>/dev/null)"; done
            xcrun simctl list runtimes | grep -i ios
            for x in /Applications/Xcode_27*.app; do [ -d "$x" ] && echo "with $x:" && DEVELOPER_DIR=$x/Contents/Developer xcrun simctl list runtimes | grep -i ios; done
            true
          } > probe.txt 2>&1
          msg=$(sed -e 's/%/%25/g' probe.txt | awk '{printf "%s%%0A", $0}')
          echo "::notice title=${{ matrix.os }}::$msg"
