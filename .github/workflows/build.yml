name: Build IPA

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$XC" ] && XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Fetch engine (libmpv + FFmpeg + libplacebo + MoltenVK)
        run: bash scripts/fetch-engine.sh

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate --spec project.yml

      - name: Set version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(tr -d '[:space:]' < VERSION)"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build
        run: |
          xcodebuild \
            -project GlassPlayer.xcodeproj \
            -scheme GlassPlayer \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || {
              grep -E "error:|fatal error|ld: |Undefined symbol|clang: error" build.log | sed "s#$GITHUB_WORKSPACE/##g" | awk '!seen[$0]++' | head -400 > errors.txt
              [ -s errors.txt ] || tail -60 build.log > errors.txt
              cat errors.txt
              # Surface errors as annotations (readable via the checks API).
              split -l 40 errors.txt err_chunk_
              for f in err_chunk_*; do
                msg=$(sed -e 's/%/%25/g' "$f" | awk '{printf "%s%%0A", $0}')
                echo "::error title=Build errors ($f)::$msg"
              done
              exit 1
            }
          grep -c "warning:" build.log || true

      - name: Package unsigned IPA
        run: |
          APP=$(find build/Build/Products -type d -name "GlassPlayer.app" -path "*iphoneos*" | head -1)
          test -n "$APP"
          file "$APP/GlassPlayer"
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          # Store the main binary and .car uncompressed (type 0) so signing
          # tools like kSign can extract the IPA without errors.  Everything
          # else is deflated normally.
          (cd ipa \
            && zip -qry "../GlassPlayer-$VERSION.ipa" Payload \
               -x "Payload/GlassPlayer.app/GlassPlayer" \
               -x "Payload/GlassPlayer.app/Assets.car" \
            && zip -qr0 "../GlassPlayer-$VERSION.ipa" \
               "Payload/GlassPlayer.app/GlassPlayer" \
               "Payload/GlassPlayer.app/Assets.car")
          ls -lh GlassPlayer-*.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: GlassPlayer-${{ env.VERSION }}-${{ github.run_number }}
          path: GlassPlayer-*.ipa
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
          if-no-files-found: ignore

      # Releases: bump VERSION on main (or push a v* tag). If no release
      # exists for that version yet, CI creates the tag and the release.
      - name: Publish release
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          if grep -q "mpvkit-stock" Vendor/engine.txt; then
            echo "::warning::Built with the stock engine (no Lua); not publishing a release."
            exit 0
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              gh release upload "$TAG" GlassPlayer-*.ipa --clobber
            else
              echo "Release $TAG already exists; bump VERSION to publish a new one."
            fi
            exit 0
          fi
          NOTES_FILE=$(mktemp)
          if [ -f "docs/release-notes/$TAG.md" ]; then
            cp "docs/release-notes/$TAG.md" "$NOTES_FILE"
          else
            echo "GlassPlayer $TAG" > "$NOTES_FILE"
          fi
          gh release create "$TAG" GlassPlayer-*.ipa \
            --target "$GITHUB_SHA" \
            --title "GlassPlayer $TAG" \
            --notes-file "$NOTES_FILE"
