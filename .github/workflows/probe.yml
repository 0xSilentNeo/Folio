name: Probe (fetch pages for inspection)

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Space-separated URLs to fetch with a Safari UA'
        default: 'https://www.imdb.com/title/tt0944947/'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          mkdir -p out
          i=0
          for u in ${{ github.event.inputs.urls }}; do
            i=$((i+1))
            curl -sS -L -m 30 -o "out/page$i.html" -w "%{http_code} %{size_download} $u\n" \
              -A "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1" \
              -H "Accept-Language: en-US,en;q=0.9" -H "Accept: text/html" "$u" | tee -a out/status.txt
          done
          ls -la out
      - run: |
          git config --global user.name lab-bot
          git config --global user.email lab@users.noreply.github.com
          cd out && git init -q && git checkout -q -b lab-probe && git add -A && git commit -qm "probe ${{ github.run_id }}" \
            && git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" lab-probe
