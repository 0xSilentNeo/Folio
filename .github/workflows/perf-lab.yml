name: Perf lab (profile + record a UI test on several app versions)

# Builds the app at each ref (a tag like v1.16.1, a branch, a commit) with this
# commit's UITests, seeds a library laid out like the user's, then runs one UI
# test while Time Profiler records the app and the simulator screen records.
# Results go to the perf-<ref> branch and an artifact.

on:
  # A push that changes the request file runs it too (a new workflow can only
  # be dispatched once it's on the default branch).
  push:
    branches-ignore: [main]
    paths: ['.github/perf-lab-request.json']
  workflow_dispatch:
    inputs:
      refs:
        description: 'JSON list of app refs to build (tags, branches, commits)'
        default: '["v1.16.1","v1.17.4"]'
      only:
        description: 'xcodebuild -only-testing filter'
        default: 'GlassPlayerUITests/OpenCostUITests/test60OpenClose'
      title_style:
        description: 'Title page style for the test (full | files)'
        default: 'full'
      runner:
        description: 'Runner label'
        default: 'xcode-27'

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      refs: ${{ steps.p.outputs.refs }}
      only: ${{ steps.p.outputs.only }}
      style: ${{ steps.p.outputs.style }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            R=.github/perf-lab-request.json
            echo "refs=$(jq -c .refs $R)" >> "$GITHUB_OUTPUT"
            echo "only=$(jq -r '.only // "GlassPlayerUITests/OpenCostUITests/test60OpenClose"' $R)" >> "$GITHUB_OUTPUT"
            echo "style=$(jq -r '.title_style // "full"' $R)" >> "$GITHUB_OUTPUT"
          else
            echo 'refs=${{ github.event.inputs.refs }}' >> "$GITHUB_OUTPUT"
            echo "only=${{ github.event.inputs.only }}" >> "$GITHUB_OUTPUT"
            echo "style=${{ github.event.inputs.title_style }}" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  run:
    needs: plan
    runs-on: ${{ github.event.inputs.runner || 'xcode-27' }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(needs.plan.outputs.refs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: App at ${{ matrix.ref }}, tests and lab scripts from this commit
        run: |
          LAB=$(git rev-parse HEAD)
          git checkout -q -f "${{ matrix.ref }}"
          git checkout -q "$LAB" -- UITests scripts/lab
          echo "app $(git rev-parse --short HEAD) ($(git describe --tags --always)), tests from ${LAB:0:7}"
          ls UITests

      - name: Select Xcode
        run: |
          pick() { for x in "$@"; do [ -d "$x" ] || continue; case "$x" in *beta*|*Beta*|*Release_Candidate*) continue;; esac
            echo "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$x/Contents/version.plist") $x"; done | sort -V | tail -1 | cut -d' ' -f2-; }
          XC=$(pick /Applications/Xcode_27*.app)
          [ -z "$XC" ] && XC=$(pick /Applications/Xcode_26*.app)
          [ -z "$XC" ] && XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Fetch engine (stock MPVKit — simulator slices)
        run: ENGINE=stock SLICE=simulator bash scripts/fetch-engine.sh

      - name: Generate project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate --spec project.yml

      - name: Build for testing
        run: |
          xcodebuild -project GlassPlayer.xcodeproj -scheme GlassPlayer -sdk iphonesimulator -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="-" build-for-testing > build.log 2>&1 || {
              grep -E "error:|ld: |Undefined symbol" build.log | sort -u | head -40 | sed 's/^/::error::/'
              tail -60 build.log | sed 's/^/::warning::/'
              exit 1
            }

      - name: Boot simulator
        id: sim
        run: |
          xcrun simctl list devices available -j > devices.json
          PICK=$(jq -r '.devices | to_entries[] | select(.key|test("SimRuntime.iOS-")) | .key as $rt | .value[]
                 | select(.isAvailable and (.name|test("^iPhone [0-9]+ Pro Max$")))
                 | "\($rt | capture("iOS-(?<v>[0-9-]+)").v | gsub("-";".")) \(.name | capture("(?<n>[0-9]+)").n) \(.udid)"' devices.json \
                 | sort -t' ' -k1,1V -k2,2n | tail -1)
          [ -z "$PICK" ] && PICK=$(jq -r '.devices | to_entries[] | select(.key|test("SimRuntime.iOS-")) | .key as $rt | .value[]
                 | select(.isAvailable and (.name|test("^iPhone [0-9]+ Pro$")))
                 | "\($rt | capture("iOS-(?<v>[0-9-]+)").v | gsub("-";".")) \(.name | capture("(?<n>[0-9]+)").n) \(.udid)"' devices.json \
                 | sort -t' ' -k1,1V -k2,2n | tail -1)
          UDID=$(echo "$PICK" | cut -d' ' -f3)
          echo "::notice title=sim::$PICK"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b || true
          open -a Simulator --args -CurrentDeviceUDID "$UDID" || true
          sleep 15
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Install and seed a library like yours
        run: |
          UDID=${{ steps.sim.outputs.udid }}
          APP=build/Build/Products/Release-iphonesimulator/GlassPlayer.app
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" dev.silentneo.glassplayer -uiTestLibrary >/dev/null; sleep 6
          xcrun simctl terminate "$UDID" dev.silentneo.glassplayer || true
          CONT=$(xcrun simctl get_app_container "$UDID" dev.silentneo.glassplayer data)
          SRC=$(find "$APP" -name lab.mp4 | head -1)
          M="$CONT/Documents/Media"
          mkdir -p "$M/Mobland s01" "$M/classroom of the elite."
          for e in "01.Stick.or.Twist" "02.Jigsaw.Puzzle" "03.Plan.B" "04.Rat.Trap" "05.Funeral.for.a.Friend" "06.Antwerp.Blues" \
                   "07.Sea.Change" "08.The.Last.Supper" "09.Wanted.Man" "10.The.Pilgrimage"; do
            cp -c "$SRC" "$M/Mobland s01/MobLand.S01E$e.1080p.Blu-ray.Remux.AVC.TrueHD.5.1-SiCFoI.mkv"
          done
          for e in "01.What.is.evil.Whatever.springs.from.weakness" "02.It.takes.a.great.talent.and.skill.to.conceal.one's.talent.and.skill" \
                   "03.Man.is.an.animal.that.makes.bargains.no.other.animal.does.this" "04.We.should.not.be.upset" "05.Hell.is.other.people" \
                   "06.There.are.two.kinds.of.lies" "07.Nothing.is.as.dangerous.as.an.ignorant.friend" "08.Man.is.a.poor.judge" \
                   "09.Abandon.all.hope" "10.What.we.call.chance" "11.Every.man.has.his.weakness" "12.Those.who.dare"; do
            cp -c "$SRC" "$M/classroom of the elite./Classroom.of.the.Elite.S01E$e.1080p.FLAC.2.0.AVC.REMUX-FraMeSToR.mkv"
          done
          cp -c "$SRC" "$M/Dragon.Ball.Super.Beerus.S01E02.REPACK.1080p.CR.WEB-DL.JPN.AAC2.0.H.264.MSubs-ToonsHub.mkv"
          find "$M" -type f | sed "s|$M/||" | sort
          python3 scripts/lab/seed_history.py "$CONT" "$M"

      - name: Run the test with Time Profiler and screen recording
        run: |
          UDID=${{ steps.sim.outputs.udid }}
          mkdir -p lab
          xcrun simctl io "$UDID" recordVideo --codec h264 --force lab/screen.mp4 2> lab/record.err &
          REC=$!
          # When the recording really started (it prints "Recording started").
          for i in $(seq 1 100); do grep -q "Recording started" lab/record.err 2>/dev/null && break; sleep 0.05; done
          python3 -c 'import datetime;print(datetime.datetime.now().astimezone().isoformat())' > lab/record-start.txt
          cat lab/record-start.txt
          ONLY="${{ needs.plan.outputs.only }}"
          TEST_RUNNER_LAB_TITLE_STYLE="${{ needs.plan.outputs.style }}" \
          xcodebuild test-without-building -project GlassPlayer.xcodeproj -scheme GlassPlayer -configuration Release \
            -destination "id=$UDID" -derivedDataPath build -only-testing:"$ONLY" > lab/test.log 2>&1 &
          TEST=$!
          # Attach Time Profiler once the test has launched the app for good
          # (its first OPENCOST line), to the app in this simulator.
          for i in $(seq 1 900); do grep -q "OPENCOST" lab/test.log 2>/dev/null && break; sleep 0.2; done
          PID=$(pgrep -f "GlassPlayer\.app/GlassPlayer( |$)" | tail -1)
          echo "app pid: ${PID:-none}"
          XT=""
          if [ -n "$PID" ]; then
            xcrun xctrace record --template 'Time Profiler' --device "$UDID" --attach "$PID" --output lab/tp.trace --time-limit 900s > lab/xctrace.log 2>&1 &
            XT=$!
            sleep 4
            if ! kill -0 $XT 2>/dev/null; then
              echo "attach by pid failed ($(tail -1 lab/xctrace.log)); by name"
              xcrun xctrace record --template 'Time Profiler' --device "$UDID" --attach GlassPlayer --output lab/tp.trace --time-limit 900s > lab/xctrace.log 2>&1 &
              XT=$!
            fi
          fi
          wait $TEST || echo "::warning::UI test failed (see test.log)"
          grep -E "OPENCOST|error:|failed|passed" lab/test.log | head -80 || true
          if [ -n "$XT" ]; then kill -INT $XT 2>/dev/null || true; wait $XT || true; fi
          kill -INT $REC 2>/dev/null || true
          wait $REC || true
          ls -la lab
          CONT=$(xcrun simctl get_app_container "$UDID" dev.silentneo.glassplayer data || true)
          [ -n "$CONT" ] && find "$CONT" -path "*diagnostics*" -name "*.log" -exec cp {} lab/ \; || true
          tail -5 lab/xctrace.log || true

      - name: Export and summarise the profile
        run: |
          [ -d lab/tp.trace ] || { echo "no trace"; exit 0; }
          xcrun xctrace export --input lab/tp.trace --toc > lab/toc.xml
          xcrun xctrace export --input lab/tp.trace --xpath '/trace-toc/run[@number="1"]/data/table[@schema="time-profile"]' > lab/tp.xml
          ls -la lab
          python3 scripts/lab/profile_summary.py lab/tp.xml lab/toc.xml lab/test.log > lab/profile-summary.txt 2>&1 || true
          head -150 lab/profile-summary.txt
          xz -T0 -6 lab/tp.xml
          rm -rf lab/tp.trace

      - name: Publish results
        if: always()
        run: |
          git config user.name lab-bot
          git config user.email lab@users.noreply.github.com
          REF="${{ matrix.ref }}"; SAFE=$(echo "$REF" | tr '/.' '--')
          mkdir -p out && cp -R lab/* out/ 2>/dev/null || true
          tail -2000 build.log > out/build-tail.log 2>/dev/null || true
          find out -type f -size +90M | while read f; do split -b 90m "$f" "$f.part-" && rm "$f"; done
          cd out && git init -q && git checkout -q -b "perf-$SAFE" && git add -A && git commit -qm "perf lab ${{ github.run_id }} ($REF)" \
            && git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "perf-$SAFE"
