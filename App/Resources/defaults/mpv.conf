# Folio mpv.conf
#
# mpv reads this file every time a video starts. It is the same mpv.conf
# as on a computer: one option per line, "name=value". A line starting
# with # is a comment: remove the # to turn an example on. Edit it in
# Folio → Settings → mpv → mpv.conf, or in Files → On My iPhone → Folio
# → mpv. "~~/" in a path means that mpv folder.
#
# Folio sets some options from its own settings before reading this file,
# so a value here wins over Settings: audio and subtitle languages, the
# subtitle look, hardware decoding, audio channels, cache size, speed.
# A change you make in the player while watching wins over this file again.
#
# Leave these alone. Folio sets them for the renderer and for Picture in
# Picture, and a value here breaks the picture or the player:
#   vo, gpu-api, gpu-context, opengl-es, wid, config, config-dir, idle,
#   keep-open, terminal, log-file, watch-later-dir, input-default-bindings
# Also not useful on iOS: ytdl (yt-dlp can't run on iOS), osc (mouse
# only; Folio draws its own controls), save-position-on-quit and
# resume-playback (Folio remembers where you stopped itself).
# Full list of options: https://mpv.io/manual/stable/#options


# ── Languages ───────────────────────────────────────────────────────────
# Audio and subtitle languages to pick, in order (ISO codes).
#alang=jpn,ja,eng,en
#slang=eng,en
# No subtitles unless you pick some:
#sid=no


# ── Subtitles: how they look ────────────────────────────────────────────
# These apply to plain subtitles (SRT, WebVTT). Styled ASS subtitles keep
# their own look unless sub-ass-override says otherwise.
#sub-font="Helvetica Neue"
#sub-font-size=44
#sub-color="#FFFFFF"
#sub-border-color="#000000"
#sub-border-size=2.5
#sub-shadow-offset=1
# A dark box behind the text instead of an outline:
#sub-border-style=background-box
#sub-back-color=0.0/0.0/0.0/0.6
# Height on screen: 100 is the bottom edge, smaller is higher.
#sub-pos=95
# Make styled (ASS) subtitles use the style above too: no, scale, force.
#sub-ass-override=force
# Fonts: put .ttf/.otf files in ~~/fonts and name them in sub-font.


# ── Subtitles: which and when ───────────────────────────────────────────
# Load subtitle files next to the video: exact (same name), fuzzy (name
# starts the same; Folio's default), all (every subtitle in the folder).
#sub-auto=fuzzy
# Also look in sub-folders of the video's folder:
#sub-file-paths=subs:Subs:subtitles
# Two subtitles at once (a second language at the top): the track number.
#secondary-sid=2


# ── Audio ───────────────────────────────────────────────────────────────
# Start delay of the sound against the picture, in seconds (a Bluetooth
# headset that lags: try -0.15). The player's menu changes it per video.
#audio-delay=0
# Stereo out even on a surround track, or "auto" for surround to AirPlay
# and HDMI (the surround setting in Settings → Audio & Subtitles sets this):
#audio-channels=stereo
# How loud the player's Boost may go, in percent (Folio uses 200):
#volume-max=150
# Your own audio filters. Night mode and dialogue boost add theirs under
# their own name, so they work on top of these. Example: a bass cut.
#af=lavfi=[equalizer=f=60:t=o:w=2:g=-6]


# ── Picture quality ─────────────────────────────────────────────────────
# mpv's preset for better scaling and dithering (costs GPU and battery):
#profile=high-quality
# Or the scalers one by one:
#scale=ewa_lanczossharp
#cscale=ewa_lanczossharp
#dscale=mitchell
# Smooth out colour banding in dark scenes and gradients:
#deband=yes
# HDR on a screen without HDR: how bright scenes are brought down.
#tone-mapping=bt.2390
#hdr-compute-peak=yes
# Brightness, contrast, saturation, gamma: -100 to 100.
#brightness=0
#saturation=0


# ── Motion ──────────────────────────────────────────────────────────────
# Smoother motion: frames are blended to the screen's refresh rate.
# Costs battery; may not work with every renderer.
#video-sync=display-resample
#interpolation=yes
#tscale=oversample


# ── Streaming ───────────────────────────────────────────────────────────
# Memory for what's ahead in a stream (Settings → mpv → Cache sets this):
#demuxer-max-bytes=256MiB
# Seconds to read ahead:
#demuxer-readahead-secs=60
# A server that wants another User-Agent or extra headers:
#user-agent="Mozilla/5.0"
#http-header-fields="Referer: https://example.com/"
# Give up on a silent server after this many seconds:
#network-timeout=30


# ── Playback ────────────────────────────────────────────────────────────
# Exact seeks (to the frame, not the nearest keyframe): slower on big files.
#hr-seek=yes
# Start speed (Settings → Playback → Default speed sets this too):
#speed=1.0


# ── Screenshots ─────────────────────────────────────────────────────────
# Saved to Files → On My iPhone → Folio → Screenshots.
#screenshot-format=png
#screenshot-jpeg-quality=95
#screenshot-template="%F-%P"


# ── On-screen messages (from scripts and input.conf's show-text) ────────
#osd-font-size=36
#osd-duration=2000


# ── Profiles ────────────────────────────────────────────────────────────
# A profile is a named group of options. Turn one on with profile=name,
# from input.conf (apply-profile name), or let mpv pick it by itself.
#[anime]
#profile-desc=Anime: debanding and sharper scaling
#deband=yes
#scale=ewa_lanczossharp
#
# Picked by itself for 4K video, undone afterwards (conditions need Lua,
# which Folio's mpv has):
#[4k]
#profile-cond=p["video-params/h"] >= 2160
#profile-restore=copy
#deband=no
#
# By file type or by where it comes from:
#[extension.mkv]
#sub-auto=all
#[protocol.https]
#demuxer-readahead-secs=120
#
# Keep long lists in another file:
#include="~~/profiles.conf"
