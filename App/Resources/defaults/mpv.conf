# GlassPlayer mpv.conf
#
# This file is read by mpv every time playback starts. It works like the
# desktop mpv.conf; options here override GlassPlayer's own settings.
# Lines starting with # are comments.
#
# Do NOT change: vo (must stay libmpv), gpu-api, opengl-es.
#
# Some ideas:
#
# Prefer Japanese audio and English subs
#alang=jpn,ja,eng,en
#slang=eng,en
#
# Bigger subtitle font with a translucent box
#sub-font-size=48
#sub-border-style=background-box
#sub-back-color=0.0/0.0/0.0/0.6
#
# Better scaling (costs GPU)
#scale=ewa_lanczossharp
#cscale=ewa_lanczossharp
#
# Debanding
#deband=yes
#
# Profiles work too:
#[anime]
#profile-desc=Anime tweaks
#deband=yes
#
# Note: the built-in on-screen controller (osc) is disabled because
# GlassPlayer draws its own controls. You can enable it with osc=yes, but
# it only reacts to a mouse/trackpad.
