# GlassPlayer input.conf
#
# Key bindings for hardware keyboards (iPad Magic Keyboard, Bluetooth
# keyboards). Same syntax as desktop mpv. mpv's default bindings
# (space, arrows, j/v subs, etc.) are active as well.
#
# Examples:
#RIGHT seek 5
#LEFT  seek -5
#Ctrl+t script-binding oat-override-prompt
#i script-binding stats/display-stats-toggle
