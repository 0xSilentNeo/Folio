# Folio input.conf
#
# Keyboard shortcuts for a hardware keyboard (iPad Magic Keyboard, a
# Bluetooth keyboard). The same file as mpv's on a computer: a key, then
# what it does. A line starting with # is a comment: remove the # to turn
# an example on. Your lines win over mpv's own shortcuts.
#
# Without a keyboard, put the same commands in Folio → Settings → mpv →
# Player commands: they appear in the player's Commands menu.
#
# mpv's own shortcuts already work, among them:
#   SPACE pause      LEFT/RIGHT seek 5 s      UP/DOWN seek 1 min
#   9 / 0 volume     m mute                   [ / ] slower / faster
#   BS normal speed  j / J next subtitle      # next audio track
#   v subtitles on/off   z / x subtitle delay     s screenshot
#   . / , one frame on / back   l A-B loop      q close the player
# (i, the statistics page, is off: Folio shows its own stats in the player.)
#
# Key names: a-z 0-9, SPACE ENTER ESC TAB BS, UP DOWN LEFT RIGHT, PGUP PGDWN,
# HOME END, F1-F12, and Shift+ Ctrl+ Alt+ Meta+ (Meta is the ⌘ key).
# Commands: https://mpv.io/manual/stable/#list-of-input-commands


# ── Seeking ─────────────────────────────────────────────────────────────
#RIGHT       seek 10
#LEFT        seek -10
#Shift+RIGHT seek 85            # past an opening
#Shift+LEFT  seek -85
#Ctrl+RIGHT  add chapter 1      # next chapter
#Ctrl+LEFT   add chapter -1


# ── Sound and speed ─────────────────────────────────────────────────────
#UP          add volume 5
#DOWN        add volume -5
#Ctrl+UP     add audio-delay 0.05
#Ctrl+DOWN   add audio-delay -0.05
#}           multiply speed 1.25
#{           multiply speed 0.8


# ── Subtitles ───────────────────────────────────────────────────────────
#Shift+s     cycle sub
#Shift+a     cycle audio
#Alt+UP      add sub-pos -2     # higher
#Alt+DOWN    add sub-pos 2      # lower
#Alt+=       add sub-scale 0.1  # bigger
#Alt+-       add sub-scale -0.1
#k           cycle-values sub-ass-override "force" "scale"


# ── Picture ─────────────────────────────────────────────────────────────
#d           cycle deband
#Alt+0       set video-zoom 0; set panscan 0
#Alt+9       add video-zoom 0.1
#Ctrl+h      cycle-values hwdec "videotoolbox" "no"
# A profile from mpv.conf:
#Ctrl+a      apply-profile anime


# ── Showing things ──────────────────────────────────────────────────────
#t           show-text "${media-title}  ${time-pos} / ${duration}  (${percent-pos}%)" 3000
#Ctrl+i      show-text "${video-codec} ${width}×${height} · ${audio-codec-name} ${audio-params/channel-count} ch" 3000


# ── Scripts ─────────────────────────────────────────────────────────────
# A script's own command (see ~~/scripts/README.txt):
#Ctrl+t      script-binding myscript/action
#Ctrl+m      script-message-to myscript toggle


# ── Turning a shortcut off ──────────────────────────────────────────────
#q           ignore
