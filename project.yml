name: GlassPlayer

# XcodeGen spec. CI runs `xcodegen generate` to produce GlassPlayer.xcodeproj,
# so the .xcodeproj is never committed. Add new source folders here.

options:
  bundleIdPrefix: dev.silentneo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  GlassPlayer:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App/Sources
      - path: App/Resources/defaults
        type: folder
        buildPhase: resources
      - path: App/Assets.xcassets
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: GlassPlayer
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIBackgroundModes: [audio, picture-in-picture]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportsDocumentBrowser: false
        UIRequiresFullScreen: false
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsArbitraryLoadsForMedia: true
        NSLocalNetworkUsageDescription: GlassPlayer streams media from servers on your local network.
        NSBonjourServices: [_webdav._tcp, _webdavs._tcp]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Media
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.movie, public.audiovisual-content, public.audio, org.matroska.mkv]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.matroska.mkv
            UTTypeDescription: Matroska Video
            UTTypeConformsTo: [public.movie]
            UTTypeTagSpecification:
              public.filename-extension: [mkv]
          - UTTypeIdentifier: io.mpv.lua-script
            UTTypeDescription: mpv Lua script
            UTTypeConformsTo: [public.source-code, public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [lua]
          - UTTypeIdentifier: io.mpv.glsl-shader
            UTTypeDescription: mpv GLSL shader
            UTTypeConformsTo: [public.source-code, public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [glsl, hook]
        CFBundleURLTypes:
          - CFBundleURLName: dev.silentneo.glassplayer
            CFBundleURLSchemes: [glassplayer]
    settings:
      base:
        PRODUCT_NAME: GlassPlayer
        PRODUCT_BUNDLE_IDENTIFIER: dev.silentneo.glassplayer
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: App/Sources/Bridging/GlassPlayer-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_BITCODE: NO
        DEAD_CODE_STRIPPING: YES
        GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "GL_SILENCE_DEPRECATION=1", "GLES_SILENCE_DEPRECATION=1"]
        # libmpv (+ffmpeg, libass, libplacebo, lua, ...) prebuilt static library.
        # CI unpacks Libmpv.xcframework into Vendor/ before generating the project.
        "HEADER_SEARCH_PATHS[sdk=iphoneos*]": ["$(inherited)", "$(PROJECT_DIR)/Vendor/Libmpv.xcframework/ios-arm64/Headers"]
        "HEADER_SEARCH_PATHS[sdk=iphonesimulator*]": ["$(inherited)", "$(PROJECT_DIR)/Vendor/Libmpv.xcframework/ios-arm64_x86_64-simulator/Headers"]
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": ["$(inherited)", "$(PROJECT_DIR)/Vendor/Libmpv.xcframework/ios-arm64"]
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": ["$(inherited)", "$(PROJECT_DIR)/Vendor/Libmpv.xcframework/ios-arm64_x86_64-simulator"]
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lmpv-combined"
          - "-lz"
          - "-lbz2"
          - "-liconv"
          - "-lc++"
          - "-framework"
          - "CoreText"
          - "-framework"
          - "CoreGraphics"
          - "-framework"
          - "CoreVideo"
          - "-framework"
          - "CoreMedia"
          - "-framework"
          - "VideoToolbox"
          - "-framework"
          - "AudioToolbox"
          - "-framework"
          - "AVFoundation"
          - "-framework"
          - "OpenGLES"
          - "-framework"
          - "QuartzCore"
    scheme:
      testTargets: []
      gatherCoverageData: false
