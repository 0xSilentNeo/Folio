name: GlassPlayer

# XcodeGen spec. CI runs `xcodegen generate` to produce GlassPlayer.xcodeproj,
# so the .xcodeproj is never committed. Add new source folders here.

options:
  bundleIdPrefix: dev.silentneo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  GlassPlayer:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App/Sources
      - path: App/Resources/defaults
        type: folder
        buildPhase: resources
      - path: App/Resources/shaders
        type: folder
        buildPhase: resources
      - path: App/Resources/lab
        type: folder
        buildPhase: resources
      - path: App/Assets.xcassets
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Folio
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
        UIBackgroundModes: [audio, picture-in-picture]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportsDocumentBrowser: false
        UIRequiresFullScreen: false
        UIStatusBarStyle: UIStatusBarStyleDefault
        UIViewControllerBasedStatusBarAppearance: true
        # ProMotion: without this, an app's own animations are capped at 60 Hz on iPhone.
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsArbitraryLoadsForMedia: true
        NSLocalNetworkUsageDescription: Folio streams media from servers on your local network.
        NSBonjourServices: [_webdav._tcp, _webdavs._tcp]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Media
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.movie
              - public.video
              - public.audiovisual-content
              - public.audio
              - public.mpeg-4
              - com.apple.quicktime-movie
              - public.avi
              - public.mpeg-2-transport-stream
              - org.matroska.mkv
              - org.webmproject.webm
              - org.videolan.flv
          - CFBundleTypeName: Subtitles
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.matroska.mka, com.glassplayer.subtitle]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.matroska.mkv
            UTTypeDescription: Matroska Video
            UTTypeConformsTo: [public.movie]
            UTTypeTagSpecification:
              public.filename-extension: [mkv]
          - UTTypeIdentifier: org.webmproject.webm
            UTTypeDescription: WebM Video
            UTTypeConformsTo: [public.movie]
            UTTypeTagSpecification:
              public.filename-extension: [webm]
          - UTTypeIdentifier: org.videolan.flv
            UTTypeDescription: Flash Video
            UTTypeConformsTo: [public.movie]
            UTTypeTagSpecification:
              public.filename-extension: [flv]
          - UTTypeIdentifier: org.matroska.mka
            UTTypeDescription: Matroska Audio
            UTTypeConformsTo: [public.audio]
            UTTypeTagSpecification:
              public.filename-extension: [mka]
          - UTTypeIdentifier: com.glassplayer.subtitle
            UTTypeDescription: Subtitle
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [srt, ass, ssa, vtt, sup]
          - UTTypeIdentifier: io.mpv.lua-script
            UTTypeDescription: mpv Lua script
            UTTypeConformsTo: [public.source-code, public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [lua]
          - UTTypeIdentifier: io.mpv.glsl-shader
            UTTypeDescription: mpv GLSL shader
            UTTypeConformsTo: [public.source-code, public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [glsl, hook]
        CFBundleURLTypes:
          - CFBundleURLName: dev.silentneo.glassplayer
            CFBundleURLSchemes: [glassplayer, folio]
    settings:
      base:
        PRODUCT_NAME: GlassPlayer
        PRODUCT_BUNDLE_IDENTIFIER: dev.silentneo.glassplayer
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: App/Sources/Bridging/GlassPlayer-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Settings → General → App Icon (UIApplication.setAlternateIconName).
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIconMono AppIconAlt"
        ENABLE_BITCODE: NO
        DEAD_CODE_STRIPPING: YES
        GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "GL_SILENCE_DEPRECATION=1", "GLES_SILENCE_DEPRECATION=1"]
    # Engine link settings (frameworks, search paths, system libs) are
    # generated by scripts/engine-xcconfig.sh from Vendor/Frameworks.
    configFiles:
      Debug: Vendor/engine.xcconfig
      Release: Vendor/engine.xcconfig
    scheme:
      testTargets: [GlassPlayerUITests]
      gatherCoverageData: false

  GlassPlayerUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UITests
    dependencies:
      - target: GlassPlayer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.silentneo.glassplayer.uitests
        TEST_TARGET_NAME: GlassPlayer
