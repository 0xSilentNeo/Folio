name: Folio

# XcodeGen spec. CI runs `xcodegen generate` to produce Folio.xcodeproj,
# so the .xcodeproj is never committed. Add new source folders here.

options:
  bundleIdPrefix: dev.silentneo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  Folio:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App/Sources
      # The widget's snapshot, built into the app (which writes it) and the widget.
      - path: App/Widget/Shared
      - path: App/Resources/defaults
        type: folder
        buildPhase: resources
      - path: App/Resources/shaders
        type: folder
        buildPhase: resources
      - path: App/Resources/lab
        type: folder
        buildPhase: resources
      - path: App/Assets.xcassets
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Folio
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
        # fetch: the airing tracker's background refresh (1.21.0, AiringBackground).
        UIBackgroundModes: [audio, picture-in-picture, fetch]
        BGTaskSchedulerPermittedIdentifiers: [dev.silentneo.folio.airing-refresh]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportsDocumentBrowser: false
        UIRequiresFullScreen: false
        UIStatusBarStyle: UIStatusBarStyleDefault
        UIViewControllerBasedStatusBarAppearance: true
        # ProMotion: without this, an app's own animations are capped at 60 Hz on iPhone.
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsArbitraryLoadsForMedia: true
        NSLocalNetworkUsageDescription: Folio streams media from servers on your local network.
        NSBonjourServices: [_webdav._tcp, _webdavs._tcp]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Media
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.movie
              - public.video
              - public.audiovisual-content
              - public.audio
              - public.mpeg-4
              - com.apple.quicktime-movie
              - public.avi
              - public.mpeg-2-transport-stream
              - org.matroska.mkv
              - org.webmproject.webm
              - org.videolan.flv
          - CFBundleTypeName: Subtitles
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.matroska.mka, dev.silentneo.folio.subtitle]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.matroska.mkv
            UTTypeDescription: Matroska Video
            UTTypeConformsTo: [public.movie]
            UTTypeTagSpecification:
              public.filename-extension: [mkv]
          - UTTypeIdentifier: org.webmproject.webm
            UTTypeDescription: WebM Video
            UTTypeConformsTo: [public.movie]
            UTTypeTagSpecification:
              public.filename-extension: [webm]
          - UTTypeIdentifier: org.videolan.flv
            UTTypeDescription: Flash Video
            UTTypeConformsTo: [public.movie]
            UTTypeTagSpecification:
              public.filename-extension: [flv]
          - UTTypeIdentifier: org.matroska.mka
            UTTypeDescription: Matroska Audio
            UTTypeConformsTo: [public.audio]
            UTTypeTagSpecification:
              public.filename-extension: [mka]
          - UTTypeIdentifier: dev.silentneo.folio.subtitle
            UTTypeDescription: Subtitle
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [srt, ass, ssa, vtt, sup]
          - UTTypeIdentifier: io.mpv.lua-script
            UTTypeDescription: mpv Lua script
            UTTypeConformsTo: [public.source-code, public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [lua]
          - UTTypeIdentifier: io.mpv.glsl-shader
            UTTypeDescription: mpv GLSL shader
            UTTypeConformsTo: [public.source-code, public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [glsl, hook]
        CFBundleURLTypes:
          - CFBundleURLName: dev.silentneo.folio
            CFBundleURLSchemes: [folio]
    settings:
      base:
        PRODUCT_NAME: Folio
        PRODUCT_BUNDLE_IDENTIFIER: dev.silentneo.folio
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: App/Sources/Bridging/Folio-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Settings → General → App Icon (UIApplication.setAlternateIconName).
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIconMono AppIconAlt"
        ENABLE_BITCODE: NO
        DEAD_CODE_STRIPPING: YES
        GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "GL_SILENCE_DEPRECATION=1", "GLES_SILENCE_DEPRECATION=1"]
        # The App Group shared with the widget (1.20.3). CI builds unsigned and
        # then signs these in with ldid, so sideloading tools see the group.
        CODE_SIGN_ENTITLEMENTS: App/Folio.entitlements
    dependencies:
      # Embedded in Folio.app/PlugIns ("Embed App Extensions").
      - target: FolioWidget
    # Engine link settings (frameworks, search paths, system libs) are
    # generated by scripts/engine-xcconfig.sh from Vendor/Frameworks.
    configFiles:
      Debug: Vendor/engine.xcconfig
      Release: Vendor/engine.xcconfig
    scheme:
      testTargets: [FolioUITests]
      gatherCoverageData: false

  # The Continue Watching widget (1.20.3): small and medium on the Home
  # Screen, rectangular on the Lock Screen. It reads the snapshot the app
  # writes into the App Group's container; it links nothing of the engine's.
  FolioWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App/Widget/Extension
      - path: App/Widget/Shared
    settings:
      base:
        PRODUCT_NAME: FolioWidget
        PRODUCT_BUNDLE_IDENTIFIER: dev.silentneo.folio.widget
        INFOPLIST_FILE: App/Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Widget/FolioWidget.entitlements
        # Overridden by CI's MARKETING_VERSION / CURRENT_PROJECT_VERSION, as the app's.
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks", "@executable_path/../../Frameworks"]
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

  # Unit tests (Debug only: they import the app with @testable). Run with
  # the FolioUnitTests scheme, so the app scheme's Release UI tests
  # don't build them.
  FolioTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: Folio
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.silentneo.folio.tests
        # The engine is linked into the app only (the tests run inside it).
        OTHER_LDFLAGS: ""
    # The app's bridging header imports mpv's headers; a test target that
    # imports the app has to find them too (search paths only).
    configFiles:
      Debug: Vendor/engine.xcconfig
      Release: Vendor/engine.xcconfig

  FolioUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UITests
    dependencies:
      - target: Folio
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.silentneo.folio.uitests
        TEST_TARGET_NAME: Folio

schemes:
  FolioUnitTests:
    build:
      targets:
        Folio: [test]
        FolioTests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets: [FolioTests]
